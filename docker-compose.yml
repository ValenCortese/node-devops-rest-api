services:
  api:
    build:
      context: .
      target: production

    container_name: pokemon-api

    ports:
      - "3000:3000"

    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      # Configuración del endpoint OTLP interno al clúster de Compose
      - OTEL_SERVICE_NAME=pokemon-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    
    networks:
      - observability-network
    depends_on:
      - otel-collector

  # -----------------------------------
  # OpenTelemetry Collector
  # -----------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC endpoint 
      - "4318:4318" # OTLP HTTP endpoint 
    networks:
      - observability-network
    depends_on:
      - tempo
      - loki

  # -----------------------------------
  # Tempo (Almacenamiento de Traces)
  # -----------------------------------
  tempo:
    image: grafana/tempo:2.4.0
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200" 
    networks:
      - observability-network

  # -----------------------------------
  # Loki (Almacenamiento de Logs)
  # -----------------------------------
  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100" 
    networks:
      - observability-network

  # -----------------------------------
  # Grafana (Visualización)
  # -----------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true # Sin credenciales para dev
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - observability-network
    depends_on:
      - tempo
      - loki
      
  prometheus:
    image: prom/prometheus:latest

    container_name: prometheus

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    ports:
      - "9090:9090"

    networks:
      - observability-network

networks:
  observability-network:
    driver: bridge

volumes:
  tempo-data:
  loki-data:
  grafana-data:
  prometheus-data: